# Rate limiting (http context, conf.d içinden geçerli). Genel /api/ trafiği
# için cömert bir limit: normal panel kullanımını etkilemez, brute-force ve
# run-away döngüleri frenler. Login uç noktası daha sıkı.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
# 2026-09-26 (#79): /ws korumasızdı — tek istemci sınırsız eşzamanlı WS
# bağlantı açabiliyordu. Zone'lar karşılaştırılabilir (kararları süreç içi
# paylaşılan bellekte tutulur) → yeni zone tanımlamak mevcut
# limit_conn_zone'larla çakışmaz.
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# Docker gömülü DNS resolver'ı.
#
# 2026-10-15 (denetim düzeltmesi, §5 P1) — GERÇEK DAVRANIŞ: bu dosyadaki
# TÜM proxy_pass'ler aşağıdaki `upstream … { server backend:8004; }`
# bloklarına gider ve upstream bloğundaki hostname YALNIZ nginx açılışında
# (config yüklenirken) çözülür; `resolver` upstream bloklarını ETKİLEMEZ
# (nginx OSS'de `server … resolve` parametresi yok, yalnız nginx Plus).
# Yani bu resolver şu an hiçbir proxy_pass tarafından KULLANILMIYOR; yalnız
# ileride `set $u http://…; proxy_pass $u;` biçiminde değişkenli bir
# proxy_pass eklenirse devreye girer. Zararsız olduğu için bırakıldı.
#
# Upstream IP'si değişince (backend/frontend yeniden yaratıldığında) nginx
# eski IP'ye proxy'ler → 502/503. Bunun çözümü nginx'te DEĞİL compose'da:
# docker-compose.yaml `gateway.depends_on … restart: true` ile upstream
# yeniden başlayınca gateway de yeniden başlar ve adları yeniden çözer.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# 2026-10-15 (denetim düzeltmesi): gerçek istemci IP'si.
#
# Gateway'in önünde Coolify'ın Traefik proxy'si vardır; nginx'in gördüğü
# `$remote_addr` Traefik'in konteyner IP'sidir. Bu durumda
# `limit_req_zone $binary_remote_addr` ve `limit_conn_zone` TÜM kullanıcıları
# tek bir IP (Traefik) olarak sayar → bir kullanıcının taşması herkesi
# 429'a düşürür; backend'e giden X-Real-IP de Traefik IP'si olur.
#
# `set_real_ip_from` ile güvenilen proxy aralıklarından gelen
# X-Forwarded-For zincirinde, güvenilmeyen İLK adres (`real_ip_recursive on`)
# `$remote_addr` olarak alınır. Aralıklar RFC1918 özel ağları: Docker bridge
# (172.16/12), Coolify/kullanıcı ağları (10/8), ev/VPN (192.168/16).
# İnternetten gelen bir istek bu aralıklarda OLAMAZ → sahte X-Forwarded-For
# ile IP taklit edilemez (yalnız güvenilen proxy'nin eklediği zincir okunur).
# Traefik kendi public IP'den çalışıyorsa (nadir) o IP de eklenmelidir.
# ---------------------------------------------------------------------------
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# 2026-09-28 (Gateway Timeout düzeltmesi): upstream keepalive bağlantılar.
#
# Sorun: nginx her proxy_pass'te backend'e yeni TCP bağlantısı açıyordu.
# Backend event loop'u 25+ arka plan göreviyle meşgulken yeni bağlantı
# kabul etmesi gecikiyordu → connect timeout → 504 Gateway Timeout.
#
# Çözüm: upstream bloğu + keepalive ile nginx → backend arasında kalıcı
# TCP bağlantı havuzu tutulur. Yeni istek geldiğinde hazır bağlantı
# kullanılır; TCP handshake gecikmesi ortadan kalkar.
#
# 2026-10-15 (denetim düzeltmesi): eski not "DNS yenileme değişkenli
# proxy_pass ile sağlanır" diyordu ama bu dosyada değişkenli proxy_pass
# YOK — her location `http://*_pool` adını kullanır. Bilinçli trade-off:
# keepalive havuzu korunur (değişkenli proxy_pass keepalive'ı atlar),
# DNS tazeliği ise compose `depends_on … restart: true` ile sağlanır
# (gateway, upstream konteyner yeniden yaratılınca kendisi de yeniden
# başlar). Deploy dışında upstream IP'si değişmez.
# ---------------------------------------------------------------------------
upstream backend_pool {
    server backend:8004;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend:3004;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream frontend_odak_pool {
    server scalperintelligent:3055;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Güvenlik başlıkları. TLS Coolify tarafında sonlanır; HSTS yine de
    # tarayıcıya iletilir.
    #
    # 2026-09-26 (#77): `includeSubDomains` kaldırılmıştı (alt alan adları
    # TLS sunmuyorsa geri dönüşü yok diye).
    # 2026-10-15 (denetim düzeltmesi, §3): GERİ EKLENDİ ve HSTS artık TEK
    # yerden (gateway) üretilir — backend'deki kopya kaldırıldı (çift başlık
    # tarayıcıda tutarsız politika demekti). Gerekçe: Coolify tüm alt alan
    # adları için Let's Encrypt TLS sonlandırır; TLS'siz alt alan adı YOK.
    # Yeni bir alt alan adı eklerken TLS'nin açık olduğundan emin olun.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 2026-09-26 (#78): CSP Next.js'in inline stiller/`<script>` yüzeyiyle
    # çatıştığı için UYGULANAMAZ; ama report-only ile tarayıcı console'unda
    # ihlalleri görmek mümkün. `Content-Security-Policy-Report-Only` engellemez,
    # yalnız raporlar. `report-uri` bir toplayıcı adresi değil; şimdilik
    # tarayıcı içi gözlem için boş bırakıldı — gerçek bir endpoint
    # (örn. /api/security/csp-report) eklenene kadar kısıt uygulanmaz.
    # 2026-10-15 (denetim düzeltmesi): BİLİNÇLİ OLARAK Report-Only kaldı.
    # Zorlayıcı CSP için `'unsafe-inline'` kaldırılmalı; Next.js'in hydration
    # inline script'leri ise istek başına nonce ister (middleware'de nonce
    # üretip `<Script nonce>`/`next.config` headers'a plumb etmek, her iki
    # UI'da). Bu nonce altyapısı olmadan sıkı CSP uygulamayı kırar.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------
    # 2026-09-28: Backend upstream hata sayfaları.
    #
    # Backend başlangıçta 25+ arka plan görevi çalıştırır; event loop
    # meşgulken HTTP istekleri yanıt alamaz → nginx 502/504 döndürür.
    # proxy_intercept_errors + error_page ile kullanıcıya ham
    # "502 Bad Gateway" yerine açıklayıcı JSON döndürülür.
    # Frontend (tarayıcı) bu JSON'ı yakalayıp "Sistem başlatılıyor..."
    # mesajı gösterebilir veya otomatik yeniden deneyebilir.
    # -------------------------------------------------------------------
    proxy_intercept_errors on;

    error_page 502 503 504 =503 /backend_unavailable.json;
    location = /backend_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"status":"unavailable","detail":"Backend servisi şu an meşgul veya başlatılıyor. Lütfen birkaç saniye bekleyip tekrar deneyin.","retry_after_seconds":5}';
    }

    location = /api/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # 2026-09-28: connect_timeout eklendi — backend meşgulken bağlantı
        # kurulması 60s varsayılanında takılıyordu; 10s ile hızlı hata alınıp
        # error_page'e düşülür, kullanıcı "bekleyin" görür.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # keepalive uyumu: Connection "" + HTTP/1.1 ile kalıcı bağlantı korunur
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini KORUR;
        # $remote_addr yazmak audit loglarında gerçek client IP'yi kaybettiriyordu.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        # 2026-10-17: backend'in KENDİ 502/503 yanıtları (ör. "Binance API anahtarları
        # çözülemedi", "Emir durumu alınamadı: ...") JSON detayıyla kullanıcıya ulaşmalı;
        # proxy_intercept_errors bunları da "Backend meşgul/başlatılıyor" metniyle
        # eziyordu ve gerçek emir hatası görünmez oluyordu. nginx'in kendi ürettiği
        # 502/504 (upstream kapalı, zaman aşımı) için error_page yine çalışır.
        proxy_intercept_errors off;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /gateway-health {
        # Konteyner healthcheck'i buraya vurur: nginx'in kendi canlılığını
        # ölçer, upstream'e bağımlı DEĞİLDİR. /health ise backend'e proxy
        # olur (backend düşünse bile gateway unhealthy işaretlenip Traefik
        # tarafından devreden çıkarılmaz).
        access_log off;
        return 200 "ok";
    }

    location /health {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /ws {
        # 2026-09-26 (#79): WS korumasızdı.
        limit_conn ws_per_ip 10;
        limit_conn_status 429;
        # WS bağlantılarında proxy_intercept_errors kapatılır — aksi halde
        # WS upgrade sırasındaki geçici 502 error_page'e düşer ve upgrade
        # tamamen başarısız olur. WS için istemci tarafı reconnect yeterli.
        proxy_intercept_errors off;
        # 2026-09-26 (#76): bu blokta X-Real-IP / X-Forwarded-For YOKTU —
        # diğer bloklarda var. WS bağlantılarında istemci IP'si kayboluyordu.
        # Artık /api/ bloklarıyla birebir aynı başlık seti.
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini korur.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2026-09-26 (#76): read_timeout vardı ama send/connect tanımsızdı.
        # Upgrade el sıkışması ve boşta kalan ping'ler bu ikisini kullanır;
        # tanımsız bırakılırsa nginx'in 60s varsayılanı devreye girer ve
        # sağlam bir bağlantı 60 saniyede kopar.
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        # WebSocket yükseltmesinde tamponlama/önbellekleme yanlıştır.
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-10-14: Yeni arayüz basePath'i (NEXT_BASE_PATH=/yeni-arayuz) altından
    # gelen WS istekleri `^~ /yeni-arayuz/` bloğuyla Next.js konteynerine
    # gidiyordu; Next.js WS proxy'leyemez → bağlantı sürekli düşüyordu.
    # Exact match `^~ /yeni-arayuz/` bloğunu GEÇER ve backend `/ws` ucuna
    # (URI yeniden yazımıyla) yükseltir. Yukarıdaki `/ws` bloğuyla BİREBİR
    # aynı koruma seti (limit_conn + upgrade + 24s timeout + buffering off).
    location = /yeni-arayuz/ws {
        limit_conn ws_per_ip 10;
        limit_conn_status 429;
        proxy_intercept_errors off;
        proxy_pass http://backend_pool/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-09-26 (#78): Next.js build çıktısı içerik-hash'li dosya adlarıyla
    # yayınlar (/_next/static/<buildId>/...). Bu dosyaların içeriği build ID
    # değişmedikçe DEĞİŞMEZ → güvenle bir yıl immutable önbelleğe alınabilir.
    # Bu blok olmadan her sayfa yüklemesinde statik varlıklar yeniden
    # doğrulanıyordu.
    location /_next/static/ {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Not: bu location kendi `add_header` kullandığı için server
        # seviyesindeki güvenlik başlıkları nginx'in add_header MİRAS ALMAMA
        # kuralı gereği buraya DÜŞMEZ. Aşağıda bilinçli olarak tekrarlanıyor.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 2026-10-15 (denetim düzeltmesi): server seviyesiyle birebir aynı.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    # Yeni arayüz aynı hostname altında tutulur; Path=/ kapsamındaki mevcut
    # scalper_session cookie'si iki UI tarafından da backend'e iletilir.
    location = /yeni-arayuz {
        proxy_intercept_errors off;
        proxy_pass http://frontend_odak_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /yeni-arayuz/ {
        proxy_intercept_errors off;
        proxy_pass http://frontend_odak_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-10-14: Eski frontend'de server action YOK; harici botlar
    # `Next-Action: x` gibi sahte başlıklarla POST atıp Next.js
    # "Server Reference ID did not match" hata log'u üretiyor (log gürültüsü,
    # güvenlik etkisi yok). Bu istekleri Next.js'e ulaştırmadan 403 ile kes.
    if ($http_next_action) {
        return 403;
    }

    location / {
        # Frontend hataları için proxy_intercept_errors kapatılır — Next.js
        # kendi hata sayfalarını render eder, nginx'in üstüne yazmamalı.
        proxy_intercept_errors off;
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 2026-09-26 (#76): bu blokta da X-Real-IP yoktu.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
