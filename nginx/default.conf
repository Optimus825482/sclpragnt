# Rate limiting (http context, conf.d içinden geçerli). Genel /api/ trafiği
# için cömert bir limit: normal panel kullanımını etkilemez, brute-force ve
# run-away döngüleri frenler. Login uç noktası daha sıkı.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Güvenlik başlıkları. TLS Coolify tarafında sonlanır; HSTS yine de
    # tarayıcıya iletilir. CSP Next.js inline stilleriyle uyumlu olmak
    # zorunda olduğundan burada zorlanmaz.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /api/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8004;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini KORUR;
        # $remote_addr yazmak audit loglarında gerçek client IP'yi kaybettiriyordu.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8004;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8004;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:8004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://frontend:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
