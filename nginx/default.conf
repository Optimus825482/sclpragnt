# Rate limiting (http context, conf.d içinden geçerli). Genel /api/ trafiği
# için cömert bir limit: normal panel kullanımını etkilemez, brute-force ve
# run-away döngüleri frenler. Login uç noktası daha sıkı.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
# 2026-09-26 (#79): /ws korumasızdı — tek istemci sınırsız eşzamanlı WS
# bağlantı açabiliyordu. Zone'lar karşılaştırılabilir (kararları süreç içi
# paylaşılan bellekte tutulur) → yeni zone tanımlamak mevcut
# limit_conn_zone'larla çakışmaz.
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# Docker gömülü DNS. Upstream konteynerler her deploy'da yeniden yaratılır ve
# IP'leri değişir; nginx varsayılanda config yüklenirken çözdüğü IP'yi sonsuza
# dek önbellekler → eski IP'ye proxy'ler → dışarıdan 502/"no available server",
# içeride her şey sağlıklı. Variable proxy_pass + bu resolver, her istekte
# (valid=10s) hostname'i yeniden çözer.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# 2026-09-28 (Gateway Timeout düzeltmesi): upstream keepalive bağlantılar.
#
# Sorun: nginx her proxy_pass'te backend'e yeni TCP bağlantısı açıyordu.
# Backend event loop'u 25+ arka plan göreviyle meşgulken yeni bağlantı
# kabul etmesi gecikiyordu → connect timeout → 504 Gateway Timeout.
#
# Çözüm: upstream bloğu + keepalive ile nginx → backend arasında kalıcı
# TCP bağlantı havuzu tutulur. Yeni istek geldiğinde hazır bağlantı
# kullanılır; TCP handshake gecikmesi ortadan kalkar.
#
# NOT: nginx OSS'de upstream server'da `resolve` parametresi YOKTUR
# (yalnız nginx Plus). DNS yenileme location bloklarındaki değişkenli
# proxy_pass ile sağlanır: `set $backend http://backend:8004;` +
# `proxy_pass $backend;` her istekte resolver'ı kullanır.
# Upstream bloğu YALNIZ keepalive bağlantı havuzu için kullanılır.
#
# ÖNEMLİ: proxy_pass'ta upstream adı kullanıldığında keepalive çalışır;
# değişken kullanıldığında ise keepalive çalışMAZ (nginx değişkeni her
# istekte yeniden çözer ve upstream havuzunu atlar). Bu trade-off:
# keepalive > DNS çözünürlüğü. Docker Compose'da konteyner adları
# deploy'lar arası korunur; DNS yenileme ihtiyacı düşüktür.
# ---------------------------------------------------------------------------
upstream backend_pool {
    server backend:8004;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend:3004;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Güvenlik başlıkları. TLS Coolify tarafında sonlanır; HSTS yine de
    # tarayıcıya iletilir.
    #
    # 2026-09-26 (#77): `includeSubDomains` KALDIRILDI. Bu katman tüm alt
    # alan adları (alt.ornek.com dahil) için HSTS'yi zorlar ve geri dönüşü
    # pratikte yoktur — alt alan adlarından biri TLS sunmuyorsa tarayıcı
    # onu düz HTTP'ye düşüremez. max-age korunmuştur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 2026-09-26 (#78): CSP Next.js'in inline stiller/`<script>` yüzeyiyle
    # çatıştığı için UYGULANAMAZ; ama report-only ile tarayıcı console'unda
    # ihlalleri görmek mümkün. `Content-Security-Policy-Report-Only` engellemez,
    # yalnız raporlar. `report-uri` bir toplayıcı adresi değil; şimdilik
    # tarayıcı içi gözlem için boş bırakıldı — gerçek bir endpoint
    # (örn. /api/security/csp-report) eklenene kadar kısıt uygulanmaz.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------
    # 2026-09-28: Backend upstream hata sayfaları.
    #
    # Backend başlangıçta 25+ arka plan görevi çalıştırır; event loop
    # meşgulken HTTP istekleri yanıt alamaz → nginx 502/504 döndürür.
    # proxy_intercept_errors + error_page ile kullanıcıya ham
    # "502 Bad Gateway" yerine açıklayıcı JSON döndürülür.
    # Frontend (tarayıcı) bu JSON'ı yakalayıp "Sistem başlatılıyor..."
    # mesajı gösterebilir veya otomatik yeniden deneyebilir.
    # -------------------------------------------------------------------
    proxy_intercept_errors on;

    error_page 502 503 504 =503 /backend_unavailable.json;
    location = /backend_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"status":"unavailable","detail":"Backend servisi şu an meşgul veya başlatılıyor. Lütfen birkaç saniye bekleyip tekrar deneyin.","retry_after_seconds":5}';
    }

    location = /api/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # 2026-09-28: connect_timeout eklendi — backend meşgulken bağlantı
        # kurulması 60s varsayılanında takılıyordu; 10s ile hızlı hata alınıp
        # error_page'e düşülür, kullanıcı "bekleyin" görür.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # keepalive uyumu: Connection "" + HTTP/1.1 ile kalıcı bağlantı korunur
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini KORUR;
        # $remote_addr yazmak audit loglarında gerçek client IP'yi kaybettiriyordu.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /gateway-health {
        # Konteyner healthcheck'i buraya vurur: nginx'in kendi canlılığını
        # ölçer, upstream'e bağımlı DEĞİLDİR. /health ise backend'e proxy
        # olur (backend düşünse bile gateway unhealthy işaretlenip Traefik
        # tarafından devreden çıkarılmaz).
        access_log off;
        return 200 "ok";
    }

    location /health {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /ws {
        # 2026-09-26 (#79): WS korumasızdı.
        limit_conn ws_per_ip 10;
        limit_conn_status 429;
        # WS bağlantılarında proxy_intercept_errors kapatılır — aksi halde
        # WS upgrade sırasındaki geçici 502 error_page'e düşer ve upgrade
        # tamamen başarısız olur. WS için istemci tarafı reconnect yeterli.
        proxy_intercept_errors off;
        # 2026-09-26 (#76): bu blokta X-Real-IP / X-Forwarded-For YOKTU —
        # diğer bloklarda var. WS bağlantılarında istemci IP'si kayboluyordu.
        # Artık /api/ bloklarıyla birebir aynı başlık seti.
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini korur.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2026-09-26 (#76): read_timeout vardı ama send/connect tanımsızdı.
        # Upgrade el sıkışması ve boşta kalan ping'ler bu ikisini kullanır;
        # tanımsız bırakılırsa nginx'in 60s varsayılanı devreye girer ve
        # sağlam bir bağlantı 60 saniyede kopar.
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        # WebSocket yükseltmesinde tamponlama/önbellekleme yanlıştır.
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-09-26 (#78): Next.js build çıktısı içerik-hash'li dosya adlarıyla
    # yayınlar (/_next/static/<buildId>/...). Bu dosyaların içeriği build ID
    # değişmedikçe DEĞİŞMEZ → güvenle bir yıl immutable önbelleğe alınabilir.
    # Bu blok olmadan her sayfa yüklemesinde statik varlıklar yeniden
    # doğrulanıyordu.
    location /_next/static/ {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Not: bu location kendi `add_header` kullandığı için server
        # seviyesindeki güvenlik başlıkları nginx'in add_header MİRAS ALMAMA
        # kuralı gereği buraya DÜŞMEZ. Aşağıda bilinçli olarak tekrarlanıyor.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    location / {
        # Frontend hataları için proxy_intercept_errors kapatılır — Next.js
        # kendi hata sayfalarını render eder, nginx'in üstüne yazmamalı.
        proxy_intercept_errors off;
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 2026-09-26 (#76): bu blokta da X-Real-IP yoktu.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
