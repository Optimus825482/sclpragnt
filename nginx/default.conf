# Rate limiting (http context, conf.d içinden geçerli). Genel /api/ trafiği
# için cömert bir limit: normal panel kullanımını etkilemez, brute-force ve
# run-away döngüleri frenler. Login uç noktası daha sıkı.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
# 2026-09-26 (#79): /ws korumasızdı — tek istemci sınırsız eşzamanlı WS
# bağlantı açabiliyordu. Zone'lar karşılaştırılabilir (kararları süreç içi
# paylaşılan bellekte tutulur) → yeni zone tanımlamak mevcut
# limit_conn_zone'larla çakışmaz.
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# Docker gömülü DNS. Upstream konteynerler her deploy'da yeniden yaratılır ve
# IP'leri değişir; nginx varsayılanda config yüklenirken çözdüğü IP'yi sonsuza
# dek önbellekler → eski IP'ye proxy'ler → dışarıdan 502/"no available server",
# içeride her şey sağlıklı. Variable proxy_pass + bu resolver, her istekte
# (valid=10s) hostname'i yeniden çözer.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Değişkenli proxy_pass: nginx bu değişkenleri resolver üzerinden çözer.
    set $backend_upstream http://backend:8004;
    set $frontend_upstream http://frontend:3004;

    # Güvenlik başlıkları. TLS Coolify tarafında sonlanır; HSTS yine de
    # tarayıcıya iletilir.
    #
    # 2026-09-26 (#77): `includeSubDomains` KALDIRILDI. Bu katman tüm alt
    # alan adları (alt.ornek.com dahil) için HSTS'yi zorlar ve geri dönüşü
    # pratikte yoktur — alt alan adlarından biri TLS sunmuyorsa tarayıcı
    # onu düz HTTP'ye düşüremez. max-age korunmuştur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 2026-09-26 (#78): CSP Next.js'in inline stiller/`<script>` yüzeyiyle
    # çatıştığı için UYGULANAMAZ; ama report-only ile tarayıcı console'unda
    # ihlalleri görmek mümkün. `Content-Security-Policy-Report-Only` engellemez,
    # yalnız raporlar. `report-uri` bir toplayıcı adresi değil; şimdilik
    # tarayıcı içi gözlem için boş bırakıldı — gerçek bir endpoint
    # (örn. /api/security/csp-report) eklenene kadar kısıt uygulanmaz.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /api/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini KORUR;
        # $remote_addr yazmak audit loglarında gerçek client IP'yi kaybettiriyordu.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /gateway-health {
        # Konteyner healthcheck'i buraya vurur: nginx'in kendi canlılığını
        # ölçer, upstream'e bağımlı DEĞİLDİR. /health ise backend'e proxy
        # olur (backend düşünse bile gateway unhealthy işaretlenip Traefik
        # tarafından devreden çıkarılmaz).
        access_log off;
        return 200 "ok";
    }

    location /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /ws {
        # 2026-09-26 (#79): WS korumasızdı.
        limit_conn ws_per_ip 10;
        limit_conn_status 429;
        # 2026-09-26 (#76): bu blokta X-Real-IP / X-Forwarded-For YOKTU —
        # diğer bloklarda var. WS bağlantılarında istemci IP'si kayboluyordu.
        # Artık /api/ bloklarıyla birebir aynı başlık seti.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for üstteki (Coolify) proxy zincirini korur.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 2026-09-26 (#76): read_timeout vardı ama send/connect tanımsızdı.
        # Upgrade el sıkışması ve boşta kalan ping'ler bu ikisini kullanır;
        # tanımsız bırakılırsa nginx'in 60s varsayılanı devreye girer ve
        # sağlam bir bağlantı 60 saniyede kopar.
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        # WebSocket yükseltmesinde tamponlama/önbellekleme yanlıştır.
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-09-26 (#78): Next.js build çıktısı içerik-hash'li dosya adlarıyla
    # yayınlar (/_next/static/<buildId>/...). Bu dosyaların içeriği build ID
    # değişmedikçe DEĞİŞMEZ → güvenle bir yıl immutable önbelleğe alınabilir.
    # Bu blok olmadan her sayfa yüklemesinde statik varlıklar yeniden
    # doğrulanıyordu.
    location /_next/static/ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Not: bu location kendi `add_header` kullandığı için server
        # seviyesindeki güvenlik başlıkları nginx'in add_header MİRAS ALMAMA
        # kuralı gereği buraya DÜŞMEZ. Aşağıda bilinçli olarak tekrarlanıyor.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 2026-09-26 (#76): bu blokta da X-Real-IP yoktu.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
