name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # PYTHON SÜRÜMÜ = ÜRETİM SÜRÜMÜ OLMALI (2026-09-16).
      # Üretim konteyneri `python:3.11-slim` (bkz. backend/Dockerfile). CI yalnız
      # 3.13 koşarken 3.12+ sözdizimi CI'dan GEÇTİ ve üretimde SyntaxError üretti:
      # `f"...{len(d.get("errors", []))}"` (PEP 701, iç içe aynı tırnak) → backend
      # hiç import edilemedi → konteyner 2 sn'de öldü → "container backend is
      # unhealthy" ile deploy düştü. 1116 test yeşilken üretim çöktü.
      # Artık 3.11 (üretim) BİRİNCİL hedeftir; 3.13 ileri uyumluluk sinyalini
      # korur. `fail-fast: false` ikisinin de sonucunu görmemizi sağlar.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        # Prod ile aynı imaj (pg17 + pgvector) — sürüm/extension drift olmasın.
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: scalper
          POSTGRES_PASSWORD: scalper
          POSTGRES_DB: scalper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scalper:scalper@localhost:5432/scalper
      DB_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # ---------------------------------------------------------------------
      # 2026-09-26 denetim (#14, #89, #99): CI'da lint ve coverage KAPISI
      # yoktu. Aşağıdaki adımlar eklendi.
      #
      # SERT KAPI: `ruff check` (yapılandırma `backend/ruff.toml`) yalnız
      # gerçek hata sınıflarını seçer (E9 sözdizimi, F821 tanımsız ad,
      # F811/F823 yeniden tanım). Tam E/F kural kümesi ~5000 ihlal veriyor
      # ve kapı olarak konulsaydı CI ilk çalışmada kırılırdı.
      #
      # DANIŞMA (advisory): `ruff format --check` ve geniş kural kümesi şu an
      # kapı DEĞİLDİR (`continue-on-error: true`) — 55 dosyanın 53'ü
      # biçimlendirme bekliyor; bunu tek seferlik refactor olmadan kapıya
      # çevirmek gerçekçi değil. Adımlar sonucu raporlar, böylece taban
      # görünür ve aşağı inmez.
      - name: Lint (ruff check — hard gate)
        working-directory: backend
        run: ruff check app tests scripts

      - name: Lint (ruff check — advisory, geniş kural kümesi)
        working-directory: backend
        continue-on-error: true
        run: ruff check --select E,F,W,I,B,SIM,UP --output-format=concise app tests scripts

      - name: Format check (ruff format — advisory)
        working-directory: backend
        continue-on-error: true
        run: ruff format --check app tests scripts

      - name: Run backend test suite
        working-directory: backend
        # `--cov-fail-under=55`: 2026-09-26'da ÖLÇÜLEN gerçek oran %57.
        # Eşik bilinçli olarak mevcut oranın ALTINDA — taban aşağı düşerse
        # yeni testler kazanç, silinen testler sessiz kayıp olur. Eşik
        # artırıldıkça kapsam genişletilmeli, düşürülmemeli.
        # Test başına zaman aşımı `pytest.ini`den gelir (120 sn) —
        # `pytest-timeout` sayesinde kilitlenen test job'ı asılı tutmaz.
        run: >-
          python -m pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=55

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
