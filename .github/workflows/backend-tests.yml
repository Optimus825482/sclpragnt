name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # PYTHON SÜRÜMÜ = ÜRETİM SÜRÜMÜ OLMALI (2026-09-16).
      # Üretim konteyneri `python:3.11-slim` (bkz. backend/Dockerfile). CI yalnız
      # 3.13 koşarken 3.12+ sözdizimi CI'dan GEÇTİ ve üretimde SyntaxError üretti:
      # `f"...{len(d.get("errors", []))}"` (PEP 701, iç içe aynı tırnak) → backend
      # hiç import edilemedi → konteyner 2 sn'de öldü → "container backend is
      # unhealthy" ile deploy düştü. 1116 test yeşilken üretim çöktü.
      # Artık 3.11 (üretim) BİRİNCİL hedeftir; 3.13 ileri uyumluluk sinyalini
      # korur. `fail-fast: false` ikisinin de sonucunu görmemizi sağlar.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        # Prod ile aynı imaj (pg17 + pgvector) — sürüm/extension drift olmasın.
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: scalper
          POSTGRES_PASSWORD: scalper
          POSTGRES_DB: scalper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scalper:scalper@localhost:5432/scalper
      DB_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
