# ============================================================================
# SCALPERNEW gateway — scalpernew.erkanerdem.online
#
# Kök docker-compose'taki (scalper.erkanerdem.online) hardened gateway'in
# bu stack'e uyarlanmış SADENİŞMİŞ hali. Farklar:
#   * basePath (/yeni-arayuz) rotaları YOK — arayüz kökte servis edilir
#   * yalnız tek frontend upstream'i (frontend:3055)
# Korunan tüm sertleştirmeler: rate limit'ler, WS limit_conn, upstream
# keepalive, güvenlik başlıkları, immutable statik cache, Next-Action
# bot engeli, backendUnavailable JSON hata sayfası.
# ============================================================================

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend_pool {
    server backend:8004;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend:3055;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name scalpernew.erkanerdem.online;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    proxy_intercept_errors on;
    error_page 502 503 504 =503 /backend_unavailable.json;
    location = /backend_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"status":"unavailable","detail":"Backend servisi şu an meşgul veya başlatılıyor. Lütfen birkaç saniye bekleyip tekrar deneyin.","retry_after_seconds":5}';
    }

    location = /api/auth/login {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok";
    }

    location /health {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /ws {
        limit_conn ws_per_ip 10;
        limit_conn_status 429;
        proxy_intercept_errors off;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    location /_next/static/ {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    # Eski stack'teki gibi: server action'ı olmayan Next.js uygulamalarına
    # gönderilen sahte `Next-Action` başlıklı bot istekleri log gürültüsü
    # üretir → Next.js'e ulaştırmadan kes.
    if ($http_next_action) {
        return 403;
    }

    location / {
        proxy_intercept_errors off;
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
