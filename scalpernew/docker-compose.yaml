# ============================================================================
# SCALPERNEW — bağımsız, izole deployment (scalpernew.erkanerdem.online)
#
# Bu stack ESKİ stack'ten (kök docker-compose.yaml) TAMAMEN AYRIDIR:
#   * kendi Postgres'i: veritabanı adı `scalpernew` (yeni/temiz veri)
#   * kendi volume'ları: scalpernew_pg_data / scalpernew_data / scalpernew_whatsapp_auth
#   * kendi ağı: compose proje adı `scalpernew` → servis adları yalnız bu
#     ağda çözülür; eski stack'in `backend`/`frontend` servisleriyle ÇAKIŞMAZ
#   * basePath YOK: arayüz doğrudan kökte servis edilir (WS zaten kök /ws)
#
# Coolify: yeni "Docker Compose" kaynağı → compose dosya yolu:
#   ./scalpernew/docker-compose.yaml
# Domain alanına `scalpernew.erkanerdem.online` yaz (TLS Coolify/Traefik).
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    container_name: scalpernew-postgres
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalpernew}
      POSTGRES_USER: ${POSTGRES_USER:-scalpernew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - scalpernew_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalpernew} -d ${POSTGRES_DB:-scalpernew}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  backend:
    build:
      context: ./backend
    container_name: scalpernew-backend
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCALPER_ENV: ${SCALPER_ENV:-production}
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      DATABASE_URL: postgresql://${POSTGRES_USER:-scalpernew}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-scalpernew}
      DB_BACKEND: postgres
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      TZ: ${TZ:-Europe/Istanbul}
      CORS_ORIGINS: https://scalpernew.erkanerdem.online
      SCALPER_ADMIN_PASSWORD: ${SCALPER_ADMIN_PASSWORD:?SCALPER_ADMIN_PASSWORD must be set}
      SCALPER_SESSION_SECRET: ${SCALPER_SESSION_SECRET:?SCALPER_SESSION_SECRET must be set}
      SCALPER_COOKIE_SECURE: "1"
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?LLM_ENCRYPTION_KEY must be set}
      LLM_ALLOW_PRIVATE_PROVIDER: ${LLM_ALLOW_PRIVATE_PROVIDER:-0}
      TOP_GAINERS_AUTO_ACTIVATE: ${TOP_GAINERS_AUTO_ACTIVATE:-true}
      TOP_GAINERS_LIMIT: ${TOP_GAINERS_LIMIT:-10}
      TOP_GAINERS_REFRESH_SEC: ${TOP_GAINERS_REFRESH_SEC:-600}
      GLOBAL_SCAN_ENABLED: ${GLOBAL_SCAN_ENABLED:-true}
      GLOBAL_SCAN_INTERVAL_SEC: ${GLOBAL_SCAN_INTERVAL_SEC:-30}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@example.com}
      WHATSAPP_NOTIFY_ENABLED: ${WHATSAPP_NOTIFY_ENABLED:-false}
      WHATSAPP_HOURLY_ENABLED: ${WHATSAPP_HOURLY_ENABLED:-false}
      WHATSAPP_HOURLY_START_HOUR: ${WHATSAPP_HOURLY_START_HOUR:-11}
      WHATSAPP_HOURLY_END_HOUR: ${WHATSAPP_HOURLY_END_HOUR:-23}
      COMBINED_RISING_ENABLED: ${COMBINED_RISING_ENABLED:-true}
      COMBINED_RISING_TOP_N: ${COMBINED_RISING_TOP_N:-2}
      COMBINED_RISING_MIN_SCORE: ${COMBINED_RISING_MIN_SCORE:-10.0}
      COMBINED_RISING_LIST_MIN: ${COMBINED_RISING_LIST_MIN:-15}
      COMBINED_RISING_TRACK_MIN: ${COMBINED_RISING_TRACK_MIN:-5}
      COMBINED_RISING_START_HOUR: ${COMBINED_RISING_START_HOUR:-0}
      COMBINED_RISING_END_HOUR: ${COMBINED_RISING_END_HOUR:-23}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3001}
      WHATSAPP_BRIDGE_KEY: ${WHATSAPP_BRIDGE_KEY:-}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
    volumes:
      - scalpernew_data:/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=10)"]
      start_period: 60s
      interval: 5s
      timeout: 8s
      retries: 12
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      # YENİ STACK'TE basePath YOK — arayüz kökte servis edilir.
      # Dockerfile ARG varsayılanları (/yeni-arayuz) bilinçli olarak boşaltılır.
      args:
        NEXT_BASE_PATH: ""
        BACKEND_ORIGIN: http://backend:8004
        NEXT_PUBLIC_API_URL: ""
    container_name: scalpernew-frontend
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_ORIGIN: http://backend:8004
    expose:
      - "3055"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3055/ || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  gateway:
    build:
      context: ./nginx
    image: scalpernew-gateway:latest
    container_name: scalpernew-gateway
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/gateway-health || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.scalpernew-gateway.loadbalancer.server.port=80"
      - "traefik.http.services.scalpernew-gateway.loadbalancer.healthcheck.path=/gateway-health"
      - "traefik.http.services.scalpernew-gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.scalpernew-gateway.loadbalancer.healthcheck.timeout=3s"
    logging: *default-logging

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    container_name: scalpernew-whatsapp
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    environment:
      PORT: "3001"
      AUTH_DIR: /app/auth
      BRIDGE_KEY: ${WHATSAPP_BRIDGE_KEY:-}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      LOG_LEVEL: ${WA_LOG_LEVEL:-silent}
    volumes:
      - scalpernew_whatsapp_auth:/app/auth
    expose:
      - "3001"
    labels:
      - "traefik.enable=false"
    logging: *default-logging

volumes:
  scalpernew_data:
  scalpernew_pg_data:
  scalpernew_whatsapp_auth:

networks:
  coolify:
    external: true
    name: coolify
