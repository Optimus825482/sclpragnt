# Tüm servisler için Docker log rotasyonu (varsayılan sınırsız büyür).
# YAML anchor'ı kullanımdan ÖNCE tanımlanmalıdır.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 2026-09-26 denetim düzeltmesi (#74): Sembol evreni ~309'a çıkmış durumda;
# backend tek başına çok sayıda sembol tarıyor. HİÇBİR serviste
# `mem_limit`/`cpus`/`deploy.resources` yoktu → tek host'ta bir konteynerin
# OOM'u tüm stack'i (postgres dahil) düşürüyordu, veri erişilemez hale
# geliyordu. Limitler sembol evreni büyüdükçe gözden geçirilmelidir.
# NOT: `deploy.resources.limits` Compose v2'de uygulanır ( swarm dışında da
# `mem_limit`/`cpus` bridge modunda desteklenir; ikisini birlikte yazmak
# Swarm uyumluluğunu korur).
services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    stop_grace_period: 10s
    # #74: pgvector indeksleri + 3 aylık trade geçmişi. 1G.
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalper}
      POSTGRES_USER: ${POSTGRES_USER:-scalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - scalper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalper} -d ${POSTGRES_DB:-scalper}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    exclude_from_hc: true
    labels:
      - "traefik.enable=false"
    logging: *default-logging
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 10s
    # #74: en yüksek tüketici — 309 sembollük evrende scanner + LLM + WS
    # yayıncısı aynı süreçte. 2G / 2 CPU.
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 2026-10-07 (P1-11 #1): PRODUCTION_MODE artık VARSAYILAN OLARAK ÜRETİM.
      #
      # `config.py` PRODUCTION_MODE'u `SCALPER_ENV > ENVIRONMENT >
      # "development"` sırasıyla okur. Varsayılan "development" iken
      # `enforce_admin_password_policy(..., production=False)` zayıf admin
      # parolasını yalnızca UYARI düzeyine indiriyordu — yani dağıtılan
      # servis, zayıf/öngörülebilir bir admin parolasıyla canlıya çıkabiliyordu.
      # Bu artık kabul edilemez; değer üretim varsayılanına çekildi.
      #
      # ⚠️ OPERATÖR İÇİN ZORUNLU ÖN ADIM: `SCALPER_ADMIN_PASSWORD` politikayı
      # geçmelidir (>=10 karakter, tamamen rakam değil, yaygın sözlük değeri
      # değil). Aksi halde `config.py` import sırasında RuntimeError fırlatır,
      # uvicorn hiç açılmaz, healthcheck geçmez ve konteyner "Waiting"
      # durumunda kalır. Bu bir hata DEĞİL, bilinçli bir korumadır: zayıf
      # parolayla canlıya çıkmayı engeller.
      #
      # Yerel geliştirmede politika gerekmiyorsa `.env` içine
      # `SCALPER_ENV=development` yazın (docker compose .env'i otomatik okur);
      # ama ÜRETİMDE bu değeri düşürmeyin. Politika ayrıntısı ve iki çözüm
      # `config.py:admin_password_policy_message` RuntimeError metninde.
      SCALPER_ENV: ${SCALPER_ENV:-production}
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      # Use the database service in this Compose stack. A stale Coolify
      # DATABASE_URL must not redirect the backend to an unreachable host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-scalper}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-scalper}
      # This application is PostgreSQL-only. Do not allow a stale Coolify
      # variable to silently switch the backend to the retired SQLite path.
      DB_BACKEND: postgres
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      # TR saati: quiet-hours ve "gün" sınırları yerel zaman okuyan kod
      # path'leriyle tutarlı olsun (konteyner varsayılanı UTC'dir).
      TZ: ${TZ:-Europe/Istanbul}
      CORS_ORIGINS: https://scalper.erkanerdem.online
      SCALPER_ADMIN_PASSWORD: ${SCALPER_ADMIN_PASSWORD:?SCALPER_ADMIN_PASSWORD must be set}
      SCALPER_SESSION_SECRET: ${SCALPER_SESSION_SECRET:?SCALPER_SESSION_SECRET must be set}
      SCALPER_COOKIE_SECURE: "1"
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?LLM_ENCRYPTION_KEY must be set}
      LLM_ALLOW_PRIVATE_PROVIDER: ${LLM_ALLOW_PRIVATE_PROVIDER:-0}
      TOP_GAINERS_AUTO_ACTIVATE: ${TOP_GAINERS_AUTO_ACTIVATE:-true}
      TOP_GAINERS_LIMIT: ${TOP_GAINERS_LIMIT:-10}
      TOP_GAINERS_REFRESH_SEC: ${TOP_GAINERS_REFRESH_SEC:-600}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@example.com}
      # 2026-10-07 (P1-11 #3): Köprü alıcısı GÜVENLİ VARSAYILANLARLA geçilir.
      # `config.py:785-786` varsayılanları hâlâ `true/true` (alıcı açık +
      # otomatik işlem açık) ve bu dosya onları EZMEZSE dağıtılan stack açık
      # gelirdi. Burada alıcı KAPALI, otomatik işlem KAPALI verilir; operatör
      # `.env`den bilinçli olarak açar. Secret varsayılanı BOŞ → alıcı açık
      # olsa bile `verify_bridge_secret` boş secretla her isteği 401 reddeder
      # (fail-closed). DB'de kayıtlı ayar (`bridge_receiver_enabled`) env'i
      # ezebilir; o yüzden admin panelinden de kapalı doğrulayın.
      BINANCE_TR_BRIDGE_SECRET: ${BINANCE_TR_BRIDGE_SECRET:-}
      BINANCE_TR_RECEIVER_ENABLED: ${BINANCE_TR_RECEIVER_ENABLED:-0}
      BINANCE_TR_BRIDGE_AUTO_TRADE: ${BINANCE_TR_BRIDGE_AUTO_TRADE:-0}
      BINANCE_TR_BRIDGE_MIN_SCORE: ${BINANCE_TR_BRIDGE_MIN_SCORE:-0.0}
      BINANCE_TR_BRIDGE_COOLDOWN_SEC: ${BINANCE_TR_BRIDGE_COOLDOWN_SEC:-60.0}
      # WhatsApp grup bildirimi (Baileys köprüsü — ayrı konteyner).
      # Varsayılan KAPALI; operatör .env'den açar. URL iç ağ adıdır
      # (whatsapp-bridge:3001) — köprü dışarıya port AÇMAZ.
      WHATSAPP_NOTIFY_ENABLED: ${WHATSAPP_NOTIFY_ENABLED:-false}
      WHATSAPP_HOURLY_ENABLED: ${WHATSAPP_HOURLY_ENABLED:-false}
      WHATSAPP_HOURLY_START_HOUR: ${WHATSAPP_HOURLY_START_HOUR:-11}
      WHATSAPP_HOURLY_END_HOUR: ${WHATSAPP_HOURLY_END_HOUR:-23}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3001}
      WHATSAPP_BRIDGE_KEY: ${WHATSAPP_BRIDGE_KEY:-}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
    # 2026-10-07 (P1-11 #2): GİZLİ DEĞERLER ARTIK .env'DEN GELİR — repoda düz
    # metin YOKTUR. `environment:` altındaki `${...:?}` başvuruları host
    # ortamından ya da compose'un otomatik okuduğu git-ignored kök `.env`
    # dosyasından interpolasyon yapar (bkz. `.env.example`). Coolify'da bu
    # değerler panelden "Environment Variables" olarak verilir.
    #
    # POSTGRES_PASSWORD, SCALPER_ADMIN_PASSWORD, SCALPER_SESSION_SECRET,
    # LLM_ENCRYPTION_KEY, BINANCE_TR_BRIDGE_SECRET artık `.env` içinde
    # yaşamalıdır; `.env` git-ignored'dır ve `docker inspect` yalnızca
    # çalışma-anı çıktısını gösterir (kaynak repo temiz kalır).
    #
    # DAHA GÜÇLÜ SEÇENEK — dosya tabanlı secret (`*_FILE`) köprüsü:
    # Coolify "Secret Files" / Docker `secrets:` / `/run/secrets/*` dosyaları
    # üretir; ilgili değişken YERİNE `X_FILE=/run/secrets/...` verilir. Bu yol,
    # ajanın sahibi olmadığı `backend/app/config.py`da TEK bir düzenleme
    # gerektirir (aşağıda madde madde).
    #
    # NEDEN burada otomatik yapılmadı: `config.py` şu satırlarla DEĞERİ
    # `os.getenv("X")` ile doğrudan okur:
    #     config.py:784  BINANCE_TR_BRIDGE_SECRET = os.getenv("BINANCE_TR_BRIDGE_SECRET", "")
    #     config.py:818  _session_secret = os.getenv("SCALPER_SESSION_SECRET", "").strip()
    #     config.py:887  _admin_password = os.getenv("SCALPER_ADMIN_PASSWORD", "")
    # Değeri compose'da boş geçip yalnızca `X_FILE` vermek `:?` (fail-fast)
    # interpolasyonunu zayıflatır ve admin parola politikası boş parolada
    # hiç çalışmaz. Bu yüzden dosya-istemcisi deseni `config.py`ye taşınana
    # kadar env-yolu standart kalır. Gerekli app değişikliği (ayrı ajan):
    # `X = os.getenv("X") or _read_secret_file(os.getenv("X_FILE"))`; ardından
    # bu compose'da `secrets:` + `X_FILE:` satırları eklenerek kullanılabilir
    # hale gelir.
    #
    # Aynı desen postgres için de geçerlidir (`POSTGRES_PASSWORD_FILE` resmi
    # postgres imajı tarafından desteklenir; backend tarafı yine config.py
    # değişikliği gerektirir).
    volumes:
      - scalper_data:/data
    expose:
      - "8004"
    healthcheck:
      # 2026-09-26: timeout 3 -> 10 sn. `/health` artık sabit-zamanlı bir
      # liveness ucu (sembol taraması yok), ama 310 sembollük evrenin WS
      # + history kurulumu sırasında ilk bağlantılar thread havuzunda
      # sıraya girebiliyor. 3 sn zaman aşımı bu sırada garanti taşıyordu.
      # 10 sn hâlâ hızlı bir aralık; deploy'un "unhealthy"a düşmesini önler.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=10)"]
      # 127.0.0.1 (localhost değil): frontend healthcheck'i de IPv6 loopback
      # tuzağına düşmemek için 127.0.0.1 kullanıyor — aynı gerekçe.
      #
      # 2026-09-26: history backfill'i artık startup'ı BEKLETMİYOR
      # (`maintenance.backfill_missing_active_history` işleri arka plana
      # bırakıyor), bu yüzden 90 sn `start_period` artık zorunlu değil.
      # Yine de WS bağlantıları + sembol evreni kurulumu zaman alıyor;
      # hızlı tanıtmayı koruyup erken iptal riskini almamak için bırakıldı.
      start_period: 60s
      interval: 5s
      # probe komutunun kendi 10 sn timeout'ı ile eşleşir; probe `timeout`
      # bundan kısa kalırsa komut iptal edilip TimeoutError yazılır.
      timeout: 8s
      retries: 12
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    stop_grace_period: 5s
    # #74: Next.js build sürecinde (node) ve çalışırken 1G / 1 CPU.
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      backend:
        # The UI shell does not require the API to be healthy at process
        # start. Avoid leaving it in Created when backend warmup is slow.
        condition: service_started
    environment:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    expose:
      - "3004"
    healthcheck:
      # Next 0.0.0.0'a bağlı (HOSTNAME=0.0.0.0 Dockerfile'da); 127.0.0.1'e
      # bağlanır. localhost yerine 127.0.0.1 — IPv6 loopback trap'ini önler.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3004/ || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=false"
    logging: *default-logging

  gateway:
    build:
      context: ./nginx
    image: scalperagent-gateway:latest
    restart: unless-stopped
    stop_grace_period: 5s
    # #74: nginx düşük ayak izli; 1G üst sınır yeterli (rate-limit zone'ları
    # 10m × 3 = ~30 MB). 1 CPU.
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    expose:
      - "80"
    # Traefik (coolify-proxy) yalnızca kendi ağında bulduğu konteynerlere
    # route oluşturur. Gateway bu ağa bağlanmazsa domain router'ı hiç
    # üretilmez → dışarıdan "no available server". External network adı
    # Coolify kurulumunda varsayılan olarak 'coolify'dır.
    networks:
      # coolify ağı EXTERNAL: yerelde (`docker compose up` ile) çalıştırmak
      # İMKANSIZDIR — ağ compose dışında tanımlı olmalıdır:
      #   docker network create coolify
      # Coolify kurulumunda ağ zaten vardır. Bilerek değiştirilmedi.
      - default
      - coolify
    healthcheck:
      # nginx'in kendi canlılığı: upstream'lere bağımlı değil. /health
      # (backend proxy'si) kullanılsaydı backend'deki her kısa tıkanıklık
      # gateway'i unhealthy yapar, Coolify/Traefik de devreden çıkarırdı.
      # NOT: `localhost` yerine 127.0.0.1 — /etc/hosts'ta localhost ::1'e
      # çözümlenir; nginx yalnızca IPv4 (0.0.0.0:80) dinlediğinden wget
      # localhost'a gidince "Connection refused" alıyordu → unhealthy → 503.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/gateway-health || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    # Coolify / Traefik proxy healthcheck etiketleri:
    # Traefik proxy, gateway servisi hazır olmadan trafiği yönlendirmez.
    # Bu etiketler Coolify'daki "No health check configured" uyarısını çözer.
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.path=/gateway-health"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.timeout=3s"
    logging: *default-logging
  # 2026-10-07: Otomatik `db-backup` servisi KALDIRILDI (ürün sahibi kararı —
  # "yedeklemeye gerek yok"). pg_dump/retention/offbox/remote-cmd bloğunun
  # tamamı silindi. Deploy öncesi elle yedek almak isterseniz:
  #   docker exec <postgres> pg_dump -U scalper -d scalper -Fc -f /tmp/bak.dump
  #   docker cp <postgres>:/tmp/bak.dump ./bak.dump
  # Geri yükleme: pg_restore (psql DEĞİL — custom format `-Fc`).

  # WhatsApp köprüsü (Baileys) — 11:30 raporu + saat başı takip tablosunu
  # gruba iletir. Backend iç ağdan (http://whatsapp-bridge:3001) çağırır.
  # DIŞARIYA PORT AÇILMAZ (expose, ports DEĞİL) + traefik kapalı → internete
  # kapalı. Oturum (QR sonrası) `whatsapp_auth` volume'unda kalıcıdır; deploy
  # QR'ı tekrar gerektirmez.
  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    environment:
      PORT: "3001"
      AUTH_DIR: /app/auth
      BRIDGE_KEY: ${WHATSAPP_BRIDGE_KEY:-}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      LOG_LEVEL: ${WA_LOG_LEVEL:-warn}
    volumes:
      - whatsapp_auth:/app/auth
    expose:
      - "3001"
    labels:
      - "traefik.enable=false"
    logging: *default-logging

volumes:
  scalper_data:
  scalper_postgres_data:
  whatsapp_auth:

# Coolify proxy (Traefik) ağı — compose dışında tanımlı external ağ.
networks:
  coolify:
    external: true
    name: coolify
