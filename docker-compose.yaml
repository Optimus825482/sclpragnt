services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalper}
      POSTGRES_USER: ${POSTGRES_USER:-scalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    volumes:
      - scalper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalper} -d ${POSTGRES_DB:-scalper}"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      DATABASE_URL: ${DATABASE_URL:-postgresql://scalper:local-dev-change-me@postgres:5432/scalper}
      DB_BACKEND: ${DB_BACKEND:-postgres}
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      CORS_ORIGINS: https://scalper.erkanerdem.online
      A2A_RELAY_URL: ${A2A_RELAY_URL:-}
      A2A_SHARED_SECRET: ${A2A_SHARED_SECRET:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@example.com}
    volumes:
      - scalper_data:/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 5
  a2a-relay:
    build:
      context: ./a2a-relay
    restart: unless-stopped
    environment:
      PORT: "8010"
      A2A_SHARED_SECRET: ${A2A_SHARED_SECRET:-}
      A2A_PEER_URL: ${A2A_PEER_URL:-}
      SCALPER_A2A_URL: ${SCALPER_A2A_URL:-}
      A2A_BACKEND_URL: http://backend:8004/api/a2a/messages
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - scalper_a2a_relay:/data
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    expose:
      - "3004"

  gateway:
    build:
      context: ./nginx
    image: scalperagent-gateway:latest
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - a2a-relay
    expose:
      - "80"

volumes:
  scalper_data:
  scalper_postgres_data:
  scalper_a2a_relay:
