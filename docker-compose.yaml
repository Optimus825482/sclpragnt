services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalper}
      POSTGRES_USER: ${POSTGRES_USER:-scalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - scalper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalper} -d ${POSTGRES_DB:-scalper}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      # Use the database service in this Compose stack. A stale Coolify
      # DATABASE_URL must not redirect the backend to an unreachable host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-scalper}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-scalper}
      # This application is PostgreSQL-only. Do not allow a stale Coolify
      # variable to silently switch the backend to the retired SQLite path.
      DB_BACKEND: postgres
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      CORS_ORIGINS: https://scalper.erkanerdem.online
      A2A_RELAY_URL: ${A2A_RELAY_URL:-}
      A2A_SHARED_SECRET: ${A2A_SHARED_SECRET:?A2A_SHARED_SECRET must be set}
      SCALPER_ADMIN_PASSWORD: ${SCALPER_ADMIN_PASSWORD:?SCALPER_ADMIN_PASSWORD must be set}
      SCALPER_SESSION_SECRET: ${SCALPER_SESSION_SECRET:?SCALPER_SESSION_SECRET must be set}
      SCALPER_COOKIE_SECURE: "1"
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?LLM_ENCRYPTION_KEY must be set}
      LLM_ALLOW_PRIVATE_PROVIDER: ${LLM_ALLOW_PRIVATE_PROVIDER:-0}
      TOP_GAINERS_AUTO_ACTIVATE: ${TOP_GAINERS_AUTO_ACTIVATE:-true}
      TOP_GAINERS_LIMIT: ${TOP_GAINERS_LIMIT:-70}
      TOP_GAINERS_REFRESH_SEC: ${TOP_GAINERS_REFRESH_SEC:-21600}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@example.com}
    volumes:
      - scalper_data:/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      # Initial history hydration for the full dynamic symbol universe can
      # exceed the first few probes. Retain fast promotion once ready, while
      # avoiding an early Compose abort that leaves dependents as "Created".
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 20
  a2a-relay:
    build:
      context: ./a2a-relay
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      PORT: "8010"
      A2A_SHARED_SECRET: ${A2A_SHARED_SECRET:?A2A_SHARED_SECRET must be set}
      A2A_PEER_URL: ${A2A_PEER_URL:-}
      SCALPER_A2A_URL: ${SCALPER_A2A_URL:-}
      A2A_BACKEND_URL: http://backend:8004/api/a2a/messages
    depends_on:
      backend:
        # Coolify has a short compose-command timeout. The relay can start
        # before backend history hydration completes and will retry delivery.
        condition: service_started
    volumes:
      - scalper_a2a_relay:/data
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      backend:
        # The UI shell does not require the API to be healthy at process
        # start. Avoid leaving it in Created when backend warmup is slow.
        condition: service_started
    environment:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    expose:
      - "3004"

  gateway:
    build:
      context: ./nginx
    image: scalperagent-gateway:latest
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      - frontend
      - backend
      - a2a-relay
    expose:
      - "80"

volumes:
  scalper_data:
  scalper_postgres_data:
  scalper_a2a_relay:
