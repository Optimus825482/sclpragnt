services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      CORS_ORIGINS: https://scalper.erkanerdem.online
    volumes:
      - scalper_data:/data
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3004"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  scalper_data:
