[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
# 2026-09-26 denetim (#99): `pytest-timeout` YOKTU. Sonsuza kadar bekleyen
# bir test CI job'ını job-timeout'a kadar ASILI TUTAR ve nedeni görünmez.
# 120 sn gözlenen en yavaş testlerin üzerinde; gerçek bir kilitlenme ~2
# dakikada yakalanır ve traceback ile düşer. `thread` yöntemi, asyncio ve
# soket beklemesi de dâhil tüm kilitlenmeleri yakalar.
timeout = 120
timeout_method = thread
